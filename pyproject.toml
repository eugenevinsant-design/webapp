[project]
name = "webapp"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
    # Держать в синхронизации с requirements.txt —
    # Vercel ставит зависимости именно отсюда (uv + pyproject.toml),
    # а Docker — из requirements.txt (pip).
    # ВАЖНО: wfdb сюда НЕ добавлять — с pandas/matplotlib бандл ~360 МБ
    # и не влезает в лимит Vercel 250 МБ. На Vercel ecg_loader работает
    # через scipy-fallback; на сервере/Docker — через wfdb (requirements.txt).
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "numpy==2.2.1",
    "scipy==1.14.1",
    "python-multipart==0.0.20",
    "aiofiles==24.1.0",
    "markdown==3.7",
    "httpx==0.28.1",
    "requests==2.32.3",
    "openai>=1.50,<4",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "aiosqlite==0.20.0",
    "python-dotenv==1.0.1",
]

[tool.setuptools]
# Проект — приложение (uvicorn app.main:app), а не библиотека.
# Явно указываем единственный пакет, чтобы setuptools в flat-layout
# не пытался включить data/, alembic/, frontend/ (ошибка Vercel:
# "Multiple top-level packages discovered in a flat-layout").
packages = ["app"]

[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"